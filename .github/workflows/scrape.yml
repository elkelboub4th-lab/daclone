name: Run OuedKniss Scraper

on:
  schedule:
    # Run daily at 2 AM UTC (adjust cron as needed)
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        run: python main.py
        env:
          # Optional: override settings via env vars if your script supports it
          # WAIT_TIME: '0.5'

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ouedkniss-data-${{ github.run_number }}
          path: '*.csv'
          retention-days: 7
